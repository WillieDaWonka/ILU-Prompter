<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="640" height="320">
  <!--
    ILU Prompter - controller drawing: mouse wheel (your mouse over the preview, or a second, dedicated mouse).
    DESIGN.md "Controller drawing". Design box 320 x 160 DIP. Ids are ControlIds; classes as in controller-xbox.svg.
    Left part: the mouse from above, cable end up. Right part: the wheel, enlarged, with its treads and two chevrons.
      Treads: 10 lines, 12 apart, clipped to the enlarged wheel; y = 26 + 12 i + 3 p, p = tread phase 0..3.
      Each notch moves p by one step (away from you = up = p - 1, towards you = p + 1, wrapping 0..3);
      one poll moves the treads by (notches in that poll) mod 4 steps, in one jump, never tweened.
      Chevron up lights for 400 ms after a notch away from you; chevron down after a notch towards you.
    The left and right buttons are yours (pointer buttons, not ControlIds): drawn inert, never lit.
    Sample state shown: the wheel turned away from you (chevron up lit), Middle bound at rest, side buttons unbound.
  -->
  <style>
    .ground{fill:#181B1F}
    .body{fill:none;stroke:#6A707C;stroke-width:1.5;stroke-linejoin:round}
    .inert{fill:none;stroke:#6A707C;stroke-width:1}
    .ctl{fill:#22252B;stroke:#8F8F9C;stroke-width:1.5}
    .unb{fill:none;stroke:#5A5E68;stroke-width:1}
    .lit{fill:#CCCCDC;stroke:#CCCCDC;stroke-width:1.5}
    .chev{fill:none;stroke:#6A707C;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .chev-lit{fill:none;stroke:#CCCCDC;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .tread{stroke:#CCCCDC;stroke-width:1.5}
    .callout{fill:none;stroke:#6A707C;stroke-width:1;stroke-dasharray:2 3}
    .wheel-lit{fill:#22252B;stroke:#CCCCDC;stroke-width:1.5}
  </style>
  <defs>
    <clipPath id="WheelClip"><rect x="196" y="20" width="40" height="120" rx="20"/></clipPath>
  </defs>
  <rect class="ground" width="320" height="160"/>

  <!-- Mouse body, x 44..124, y 10..150 -->
  <path id="Body" class="body" d="M 44 50 C 44 22 60 10 84 10 C 108 10 124 22 124 50 L 124 112 C 124 136 108 150 84 150 C 60 150 44 136 44 112 Z"/>
  <!-- Pointer buttons (inert): the seam and the lower edge of the button area -->
  <path class="inert" d="M 84 10 L 84 22 M 84 48 L 84 62"/>
  <path class="inert" d="M 44 62 C 60 68 108 68 124 62"/>

  <!-- The wheel on the mouse = Wheel (scroll; stroke lights while the wheel is lit) and Middle (press; fill lights) -->
  <rect id="Middle" class="wheel-lit" x="78" y="22" width="12" height="26" rx="6"/>

  <!-- Side buttons on the thumb side: XButton2 (forward) above XButton1 (back) -->
  <rect id="XButton2" class="unb" x="38" y="74" width="8" height="16" rx="3"/>
  <rect id="XButton1" class="unb" x="38" y="94" width="8" height="16" rx="3"/>

  <!-- Callout from the small wheel to the enlarged one -->
  <path class="callout" d="M 90 22 L 196 22 M 90 48 L 196 138"/>

  <!-- Enlarged wheel, x 196..236, y 20..140 -->
  <rect id="Wheel" class="ctl" x="196" y="20" width="40" height="120" rx="20"/>
  <g clip-path="url(#WheelClip)">
    <!-- p = 0 shown -->
    <line class="tread" x1="204" y1="26" x2="228" y2="26"/>
    <line class="tread" x1="204" y1="38" x2="228" y2="38"/>
    <line class="tread" x1="204" y1="50" x2="228" y2="50"/>
    <line class="tread" x1="204" y1="62" x2="228" y2="62"/>
    <line class="tread" x1="204" y1="74" x2="228" y2="74"/>
    <line class="tread" x1="204" y1="86" x2="228" y2="86"/>
    <line class="tread" x1="204" y1="98" x2="228" y2="98"/>
    <line class="tread" x1="204" y1="110" x2="228" y2="110"/>
    <line class="tread" x1="204" y1="122" x2="228" y2="122"/>
    <line class="tread" x1="204" y1="134" x2="228" y2="134"/>
  </g>
  <!-- Chevrons: up = away from you, down = towards you -->
  <path id="Wheel.Up" class="chev-lit" d="M 206 13 L 216 5 L 226 13"/>
  <path id="Wheel.Down" class="chev" d="M 206 147 L 216 155 L 226 147"/>
</svg>
