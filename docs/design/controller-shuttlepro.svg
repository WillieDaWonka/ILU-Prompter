<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="640" height="320">
  <!--
    ILU Prompter - controller drawing: Contour ShuttlePRO v2 (15 buttons). DESIGN.md "Controller drawing".
    Design box 320 x 160 DIP. Ids are ControlIds; classes as in controller-xbox.svg and controller-shuttlexpress.svg.
    SCHEMATIC: button positions follow the provider's logical numbering (left to right, top to bottom,
    DefaultBindings.ShuttleButtons); check against the physical unit before building (DESIGN.md open question).
    Geometry (centre C = (160,100)):
      Body: rounded rect x 84..236, y 4..156, rx 24.
      Row 1, Button1..4: 18 x 10 (rx 3) centred at x 124, 148, 172, 196; y 18.
      Row 2, Button5..9: 18 x 10 (rx 3) centred at x 112, 136, 160, 184, 208; y 36.
      Ring: annulus outer r 40, inner r 30. Ticks: line (160,61)-(160,69) rotated 15k degrees about C.
        Arc band between r 32 and r 38. Same rules as the ShuttleXpress.
      Jog: circle r 26. Dimple r 3.5 at radius 17, angle 36 x (detents mod 10).
      Side buttons, 16 x 16 (rx 3): Button10 (102,76), Button11 (218,76), Button12 (102,102), Button13 (218,102).
      Thumb buttons, 24 x 14 (rx 5): Button14 (104,136), Button15 (216,136).
    Sample state shown: ring at +2 (30 degrees), Button6 lit (Blank output), Buttons 9 to 15 unbound.
  -->
  <style>
    .ground{fill:#181B1F}
    .body{fill:none;stroke:#6A707C;stroke-width:1.5}
    .ctl{fill:#22252B;stroke:#8F8F9C;stroke-width:1.5}
    .unb{fill:none;stroke:#5A5E68;stroke-width:1}
    .lit{fill:#CCCCDC;stroke:#CCCCDC;stroke-width:1.5}
    .ring{fill:none;stroke:#8F8F9C;stroke-width:1.5}
    .tick{stroke:#6A707C;stroke-width:1}
    .tick0{stroke:#8F8F9C;stroke-width:1.5}
    .tick-now{stroke:#ECECF4;stroke-width:3;stroke-linecap:round}
    .ind{fill:#CCCCDC}
    .dimple{fill:#8F8F9C}
  </style>
  <rect class="ground" width="320" height="160"/>

  <rect id="Body" class="body" x="84" y="4" width="152" height="152" rx="24"/>

  <!-- Row 1 -->
  <rect id="Button1" class="ctl" x="115" y="13" width="18" height="10" rx="3"/>
  <rect id="Button2" class="ctl" x="139" y="13" width="18" height="10" rx="3"/>
  <rect id="Button3" class="ctl" x="163" y="13" width="18" height="10" rx="3"/>
  <rect id="Button4" class="ctl" x="187" y="13" width="18" height="10" rx="3"/>
  <!-- Row 2 -->
  <rect id="Button5" class="ctl" x="103" y="31" width="18" height="10" rx="3"/>
  <rect id="Button6" class="lit" x="127" y="31" width="18" height="10" rx="3"/>
  <rect id="Button7" class="ctl" x="151" y="31" width="18" height="10" rx="3"/>
  <rect id="Button8" class="ctl" x="175" y="31" width="18" height="10" rx="3"/>
  <rect id="Button9" class="unb" x="199" y="31" width="18" height="10" rx="3"/>

  <!-- Ring -->
  <g id="Ring">
    <circle class="ring" cx="160" cy="100" r="40"/>
    <circle class="ring" cx="160" cy="100" r="30"/>
    <line class="tick" x1="160" y1="61" x2="160" y2="69" transform="rotate(-105 160 100)"/>
    <line class="tick" x1="160" y1="61" x2="160" y2="69" transform="rotate(-90 160 100)"/>
    <line class="tick" x1="160" y1="61" x2="160" y2="69" transform="rotate(-75 160 100)"/>
    <line class="tick" x1="160" y1="61" x2="160" y2="69" transform="rotate(-60 160 100)"/>
    <line class="tick" x1="160" y1="61" x2="160" y2="69" transform="rotate(-45 160 100)"/>
    <line class="tick" x1="160" y1="61" x2="160" y2="69" transform="rotate(-30 160 100)"/>
    <line class="tick" x1="160" y1="61" x2="160" y2="69" transform="rotate(-15 160 100)"/>
    <line class="tick0" x1="160" y1="61" x2="160" y2="69"/>
    <line class="tick" x1="160" y1="61" x2="160" y2="69" transform="rotate(15 160 100)"/>
    <line class="tick" x1="160" y1="61" x2="160" y2="69" transform="rotate(30 160 100)"/>
    <line class="tick" x1="160" y1="61" x2="160" y2="69" transform="rotate(45 160 100)"/>
    <line class="tick" x1="160" y1="61" x2="160" y2="69" transform="rotate(60 160 100)"/>
    <line class="tick" x1="160" y1="61" x2="160" y2="69" transform="rotate(75 160 100)"/>
    <line class="tick" x1="160" y1="61" x2="160" y2="69" transform="rotate(90 160 100)"/>
    <line class="tick" x1="160" y1="61" x2="160" y2="69" transform="rotate(105 160 100)"/>
    <!-- Arc band 0..+30 degrees, r 32..38: outer (160,62) to (179,67.09); inner (176,72.29) to (160,68) -->
    <path id="Ring.Arc" class="ind" d="M 160 62 A 38 38 0 0 1 179 67.09 L 176 72.29 A 32 32 0 0 0 160 68 Z"/>
    <line id="Ring.Now" class="tick-now" x1="160" y1="61" x2="160" y2="69" transform="rotate(30 160 100)"/>
  </g>

  <!-- Jog -->
  <circle id="Jog" class="ctl" cx="160" cy="100" r="26"/>
  <circle id="Jog.Dimple" class="dimple" cx="160" cy="83" r="3.5"/>

  <!-- Side buttons -->
  <rect id="Button10" class="unb" x="94" y="68" width="16" height="16" rx="3"/>
  <rect id="Button11" class="unb" x="210" y="68" width="16" height="16" rx="3"/>
  <rect id="Button12" class="unb" x="94" y="94" width="16" height="16" rx="3"/>
  <rect id="Button13" class="unb" x="210" y="94" width="16" height="16" rx="3"/>
  <!-- Thumb buttons -->
  <rect id="Button14" class="unb" x="92" y="129" width="24" height="14" rx="5"/>
  <rect id="Button15" class="unb" x="204" y="129" width="24" height="14" rx="5"/>
</svg>
